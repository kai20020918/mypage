name: Deploy to ConoHa WING

# WING は海外（GitHub Actions）からの SSH ログインを受け付けないため、
# 日本にある ConoHa VPS を中継して送る:  GitHub Actions → VPS → WING
#   - VPS の設定は .github/scripts/vps-setup.sh（README 参照）
#   - WING の鍵と接続情報は VPS 側にだけ置く（GitHub には置かない）

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "確認だけ（サーバーを変更しない）"
        type: boolean
        default: true

# 同時に2つのデプロイが走らないようにする
concurrency:
  group: deploy-wing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
    steps:
      # Secrets がまだ登録されていなければ、失敗にせずスキップする
      - name: Check secrets
        id: check
        env:
          OK: ${{ secrets.VPS_SSH_KEY != '' && secrets.VPS_HOST != '' && secrets.VPS_USER != '' }}
        run: |
          echo "configured=$OK" >> "$GITHUB_OUTPUT"
          [ "$OK" = "true" ] || echo "::warning::VPS_* の Secrets が未登録のため、デプロイをスキップしました"

      - uses: actions/checkout@v5
        if: steps.check.outputs.configured == 'true'

      # css/js の ?v=... をコミットIDに置き換え、ブラウザの古いキャッシュを使わせない
      - name: Update cache-busting versions
        if: steps.check.outputs.configured == 'true'
        run: |
          ver="${GITHUB_SHA::7}"
          find . -name '*.html' -not -path './.git/*' -print0 \
            | xargs -0 sed -i -E "s/\?v=[0-9A-Za-z_-]+/?v=${ver}/g"

      - name: Set up SSH (to VPS)
        if: steps.check.outputs.configured == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          echo "GitHub 側の接続元 IP: $(curl -s --max-time 5 https://ipinfo.io/ip || echo 不明)"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          if ! ssh-keygen -y -f ~/.ssh/vps_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY を秘密鍵として読み込めません。BEGIN〜END の行を含め、改行を保ったまま登録し直してください"
            exit 1
          fi
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # GitHub（海外）から VPS の SSH ポートに届くか確認してから、サーバー鍵を取得する
            if ! timeout 15 bash -c "exec 3<>/dev/tcp/$VPS_HOST/$VPS_PORT" 2>/dev/null; then
              echo "::error::GitHub から VPS の ${VPS_PORT} 番ポートに接続できません。VPS_HOST（IPアドレス）、SSH のポート番号（22以外なら Variables に VPS_PORT）、ConoHa のセキュリティグループや ufw で海外からの SSH を遮断していないかを確認してください"
              exit 1
            fi
            if ! ssh-keyscan -T 15 -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null || [ ! -s ~/.ssh/known_hosts ]; then
              echo "::error::VPS のサーバー鍵を取得できませんでした（ポートは開いていますが SSH が応答しません）"
              exit 1
            fi
          fi

      - name: Upload to VPS (staging)
        if: steps.check.outputs.configured == 'true'
        run: |
          rsync -rlptz --delete --exclude='.git' \
            -e "ssh -p $VPS_PORT -i $HOME/.ssh/vps_key -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            ./ "$VPS_USER@$VPS_HOST:portfolio-stage/"

      - name: Deploy VPS → WING (rsync)
        if: steps.check.outputs.configured == 'true'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          ssh -p "$VPS_PORT" -i ~/.ssh/vps_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -a; . ~/.config/wing-deploy.env; set +a; DRY_RUN=$DRY_RUN bash ~/portfolio-stage/.github/scripts/deploy.sh"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/vps_key
