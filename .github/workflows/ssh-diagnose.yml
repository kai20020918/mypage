name: SSH diagnose (WING)

# 手動実行のみ。サーバーには接続を試すだけで、何も変更しない
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WING_HOST: ${{ secrets.WING_HOST }}
      WING_USER: ${{ secrets.WING_USER }}
      WING_PORT: ${{ vars.WING_PORT || '8022' }}
    steps:
      - name: Runner の接続元
        run: |
          echo "IP: $(curl -s --max-time 10 https://ipinfo.io/ip)"
          echo "国: $(curl -s --max-time 10 https://ipinfo.io/country)"
          ssh -V

      - name: 鍵の準備
        env:
          WING_SSH_KEY: ${{ secrets.WING_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$WING_SSH_KEY" | tr -d '\r' > ~/.ssh/wing_key
          chmod 600 ~/.ssh/wing_key
          ssh-keygen -y -f ~/.ssh/wing_key > /dev/null && echo "登録した鍵: 読み込みOK"
          echo "登録した鍵の公開鍵指紋: $(ssh-keygen -l -f ~/.ssh/wing_key | awk '{print $1, $2, $4}')"
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/dummy_key
          ssh-keyscan -p "$WING_PORT" "$WING_HOST" > ~/.ssh/known_hosts 2>/dev/null

      - name: 接続テスト
        run: |
          try() {  # $1=鍵 $2=ラベル
            out=$(ssh -p "$WING_PORT" -i "$1" -o IdentitiesOnly=yes -o BatchMode=yes \
                  -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
                  "$WING_USER@$WING_HOST" 'echo LOGIN_OK' 2>&1) || true
            case "$out" in
              *LOGIN_OK*)            r="ログイン成功" ;;
              *"Permission denied"*) r="鍵を拒否された（Permission denied）" ;;
              *"Connection closed"*) r="サーバーに切断された（Connection closed）" ;;
              *)                     r="その他: $(echo "$out" | tail -n1)" ;;
            esac
            echo "$2 → $r"
          }
          for i in 1 2 3; do try ~/.ssh/wing_key "登録した鍵 #$i"; sleep 3; done
          try ~/.ssh/dummy_key "無関係な鍵（比較用）"

      - name: 後片付け
        if: always()
        run: rm -f ~/.ssh/wing_key ~/.ssh/dummy_key*
