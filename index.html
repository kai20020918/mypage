<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090b">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261002">
<script>
  // 開いたときのフリッカー演出は、1回の訪問（タブを閉じるまで）につき1回だけ
  (function () {
    try {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      if (sessionStorage.getItem("intro-played")) return;
      sessionStorage.setItem("intro-played", "1");
    } catch (e) {
      return;
    }
    document.documentElement.classList.add("intro");
  })();
</script>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="#top" class="logo"><span class="logo-mark" aria-hidden="true"></span>My Portfolio</a>
    <nav class="nav">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section id="top" class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="container">
      <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>Developer</p>
      <h1>こんにちは、<span class="accent-text">K</span>です。</h1>
      <p class="hero-lead">
        ここでは自分が作成したWebサイトやアプリ、開発の記録をまとめて公開しています。
      </p>
      <a href="#projects" class="btn">作品を見る <span aria-hidden="true">→</span></a>
    </div>
  </section>

  <section id="about" class="about">
    <div class="container">
      <h2 class="section-title"><span class="section-num">01</span>About</h2>
      <p>
        作った作品をこのポートフォリオで公開していきます。
      </p>
    </div>
  </section>

  <section id="projects" class="projects">
    <div class="container">
      <h2 class="section-title"><span class="section-num">02</span>Projects</h2>
      <p class="section-lead">Webサイトやアプリと、その開発の記録をまとめています。</p>
      <div id="project-list" class="project-grid">
        <!-- Cards are injected by js/main.js from js/projects-data.js -->
      </div>
    </div>
  </section>

  <section id="contact" class="contact">
    <div class="container">
      <h2 class="section-title"><span class="section-num">03</span>Contact</h2>
      <p>ご連絡は下記までお願いします。</p>
      <ul class="contact-list">
        <li><span class="contact-label">X</span><a href="https://x.com/cafeweb_dev" target="_blank" rel="noopener noreferrer">@cafeweb_dev</a></li>
        <li><span class="contact-label">GitHub</span><a href="https://github.com/kai20020918" target="_blank" rel="noopener">github.com/kai20020918</a></li>
      </ul>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; <span id="year"></span> My Portfolio</p>
  </div>
</footer>

<script src="js/projects-data.js?v=20261017"></script>
<script src="js/main.js?v=20261017"></script>
</body>
</html>
